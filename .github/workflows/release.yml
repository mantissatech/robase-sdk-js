name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$pkg_version" ]; then
            echo "Tag $TAG does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Publish
        # A prerelease tag (v1.2.0-rc.1) goes out under the `next` dist-tag so it
        # never becomes the default install.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) npm publish --provenance --access public --tag next ;;
            *)   npm publish --provenance --access public ;;
          esac

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --generate-notes $prerelease
